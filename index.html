<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      While the StrataSight app can be reached, this site hands visitors to the same page there. It first loads the
      app's icon to see that the app is up, keeping this page dark meanwhile. If that fails or takes over three seconds,
      this page shows as before. The same lines sit in demo/index.html and public/404.html.
    -->
    <style>
      html.to-app { background: #071c2c; }
      html.to-app body { visibility: hidden; }
    </style>
    <script>
      (function () {
        var app = 'https://desktop-2skpbuc.tail33b333.ts.net:8443';
        var pages = ['services', 'about', 'contact', 'sign-in'];
        var hash = location.hash.replace(/^#\/?/, '').split('/');
        var path = location.pathname.replace(/^\/+|\/+$/g, '');
        var to = '/';
        if (pages.indexOf(hash[0]) >= 0) to = '/' + hash[0] + (hash[1] ? '#' + hash[1] : '');
        else if (pages.indexOf(path) >= 0) to = '/' + path + location.hash;
        var root = document.documentElement;
        var settled = false;
        var stay = function () {
          if (settled) return;
          settled = true;
          root.classList.remove('to-app');
        };
        root.classList.add('to-app');
        var probe = new Image();
        probe.onload = function () {
          if (settled) return;
          settled = true;
          location.replace(app + to);
        };
        probe.onerror = stay;
        setTimeout(stay, 3000);
        probe.src = app + '/apple-touch-icon.png?up=' + Date.now();
      })();
    </script>
    <title>StrataSight | Value Growth Advisory</title>
    <meta
      name="description"
      content="Value growth advisory for privately held businesses. Explore business value assessments, operational efficiency consulting, and strategic growth advisory."
    />
    <link rel="canonical" href="https://stratasight.net/" />
    <meta name="theme-color" content="#071c2c" />

    <!-- Link previews (iMessage, LinkedIn, Slack, X). Image addresses must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StrataSight" />
    <meta property="og:url" content="https://stratasight.net/" />
    <meta property="og:title" content="StrataSight | Value Growth Advisory" />
    <meta
      property="og:description"
      content="Value growth advisory for privately held businesses. Explore business value assessments, operational efficiency consulting, and strategic growth advisory."
    />
    <meta property="og:image" content="https://stratasight.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StrataSight: Value growth advisory for business owners" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StrataSight | Value Growth Advisory" />
    <meta name="twitter:description" content="Value growth advisory for privately held businesses. Explore business value assessments, operational efficiency consulting, and strategic growth advisory." />
    <meta name="twitter:image" content="https://stratasight.net/og.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!--
      The page also ships as plain HTML for readers that do not run JavaScript, such as many search and AI crawlers.
      A browser that runs JavaScript hides that copy at once and shows the interactive page, which says the same.
    -->
    <script>
      document.documentElement.classList.add('js');
    </script>
    <style>
      .js .readable { display: none; }
      .readable { max-width: 720px; margin: 48px auto; padding: 0 24px; font-family: system-ui, sans-serif; line-height: 1.6; color: #0b1f2e; }
      .readable h1 { font-size: 2rem; line-height: 1.2; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
