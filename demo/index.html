<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Hands visitors to the StrataSight app while it can be reached. See the same lines in index.html. -->
    <style>
      html.to-app { background: #071c2c; }
      html.to-app body { visibility: hidden; }
    </style>
    <script>
      (function () {
        var app = 'https://desktop-2skpbuc.tail33b333.ts.net:8443';
        var pages = ['services', 'about', 'contact', 'sign-in'];
        var hash = location.hash.replace(/^#\/?/, '').split('/');
        var path = location.pathname.replace(/^\/+|\/+$/g, '');
        var to = '/';
        if (pages.indexOf(hash[0]) >= 0) to = '/' + hash[0] + (hash[1] ? '#' + hash[1] : '');
        else if (pages.indexOf(path) >= 0) to = '/' + path + location.hash;
        var root = document.documentElement;
        var going = false;
        var show = function () {
          if (!going) root.classList.remove('to-app');
        };
        root.classList.add('to-app');
        var probe = new Image();
        // The app opens whenever its icon arrives, even after this page has shown.
        probe.onload = function () {
          going = true;
          location.replace(app + to);
        };
        probe.onerror = show;
        setTimeout(show, 4000);
        probe.src = app + '/apple-touch-icon.png?up=' + Date.now();
      })();
    </script>
    <title>StrataSight platform demonstration (fictional data)</title>
    <meta
      name="description"
      content="An interactive preview of the StrataSight advisory platform using a fictional landscaping company. All figures are synthetic demonstration data."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#071c2c" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 640px; margin: 80px auto; padding: 0 24px; font-family: system-ui, sans-serif">
        <h1>StrataSight platform demonstration</h1>
        <p>This interactive demonstration needs JavaScript. <a href="../">Return to the StrataSight site.</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
